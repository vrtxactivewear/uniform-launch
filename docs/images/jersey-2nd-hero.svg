<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1B3A8A;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
      </linearGradient>
      <filter id="shadow">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
      </filter>
    </defs>

    <!-- Background -->
    <rect width="400" height="600" fill="#1a1a1a"/>

    <!-- Jersey Body -->
    <path d="M 100 80 L 150 60 L 250 60 L 300 80 L 280 280 L 120 280 Z" fill="url(#grad1)" filter="url(#shadow)"/>

    <!-- Sleeves -->
    <ellipse cx="80" cy="120" rx="35" ry="90" fill="url(#grad1)" filter="url(#shadow)"/>
    <ellipse cx="320" cy="120" rx="35" ry="90" fill="url(#grad1)" filter="url(#shadow)"/>

    <!-- Neck opening -->
    <circle cx="200" cy="85" r="25" fill="#1a1a1a"/>

    <!-- Vertical stripes -->
    <rect x="170" y="60" width="20" height="225" fill="rgba(255,255,255,0.1)"/>
    <rect x="210" y="60" width="20" height="225" fill="rgba(255,255,255,0.1)"/>

    <!-- Shine effect -->
    <ellipse cx="160" cy="150" rx="30" ry="50" fill="rgba(255,255,255,0.15)"/>
    <ellipse cx="240" cy="180" rx="25" ry="45" fill="rgba(255,255,255,0.08)"/>

    <!-- Detail lines -->
    <path d="M 100 280 Q 150 300 200 295 Q 250 300 300 280" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
  </svg>